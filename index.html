<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ES">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ES — Ethiopian Songs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:linear-gradient(180deg,#0b3d20 0%,#4d3f10 52%,#4d1518 100%);--card:#181818;--card2:#282828;--gold:#1DB954;--gold2:#1ED760;--txt:#ffffff;--mut:#b3b3b3;--line:#2a2a2a;--green:#1DB954;--red:#e0655f;--blue:#5f9de0}
html,body{height:100%}
body{background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic","Nyala",sans-serif;display:flex;justify-content:center}
#phone{width:100%;max-width:480px;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:170px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
/* top bar */
#topbar{padding:18px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#FCDD09,#DAA520);color:#0a1830;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;flex:none}
#topbar .tt b{font-size:17px;display:block}
#topbar .tt span{font-size:12px;color:var(--mut)}
/* views */
.view{display:none;padding:6px 16px 20px}
.view.on{display:block}
.sec-t{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-t small{font-weight:400;color:var(--mut);font-size:12px}
/* horizontal cards */
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hcard{flex:0 0 128px;height:150px;border-radius:14px;position:relative;overflow:hidden;border:1px solid var(--line);text-align:left;color:var(--txt);padding:0}
.hcard .cv{position:absolute;inset:0}
.hcard .lb{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hcard .lb small{display:block;font-weight:400;color:#b3b3b3;font-size:11px}
.artcard{flex:0 0 132px;border:0;background:none;text-align:left;color:var(--txt);padding:0;cursor:pointer}
.artcard .art{width:132px;height:132px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff8;overflow:hidden;border:1px solid var(--line)}
.artcard .t{display:block;font-size:13px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artcard .a{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* song rows */
.srow{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px;width:100%;background:none;border:0;color:var(--txt);text-align:left}
.srow:active{background:var(--card)}
.cover{width:52px;height:52px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff8;text-shadow:0 1px 4px rgba(0,0,0,.5);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,255,255,.07) 7px 9px)}
.srow .mi{flex:1;min-width:0}
.srow .mi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .mi span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.icobtn{background:none;border:0;color:var(--mut);font-size:19px;padding:8px;border-radius:10px}
.icobtn:active{background:var(--card2)}
.icobtn.fav{color:var(--gold)}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700}
.pill.p{background:#2a2a2a;color:var(--gold2)}
.pill.a{background:#123a24;color:#7fe0a8}
.pill.r{background:#3a1a18;color:#f0938d}
/* tab bar */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:rgba(10,12,17,.97);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabbar button .ti{font-size:21px}
#tabbar button.on{color:var(--gold)}
/* mini player */
#mp{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);width:min(460px,94%);background:var(--card2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:39;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#mp .cover{width:44px;height:44px}
#mp .mi{flex:1;min-width:0}
#mp .mi b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp .mi span{font-size:11px;color:var(--mut)}
#mpPlay{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);color:#0a1830;font-size:17px;flex:none}
/* full player */
#fp{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:100dvh;background:linear-gradient(180deg,#282828,#121212 60%);z-index:60;display:flex;flex-direction:column;padding:14px 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
#fpTop{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
#fpTop button{background:none;border:0;color:var(--txt);font-size:22px}
#fpTop span{font-size:12px;color:var(--mut);letter-spacing:2px}
#fpCover{width:min(300px,72vw);aspect-ratio:1;border-radius:18px;margin:8px auto 16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:#fff9;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#fpCover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.06) 14px 17px)}
#fpTitle{font-size:21px;font-weight:800;text-align:center}
#fpArtist{font-size:14px;color:var(--mut);text-align:center;margin:4px 0 12px}
#fpSeek{width:100%;accent-color:var(--gold)}
#fpTimes{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:2px 0 8px}
#fpCtrls{display:flex;justify-content:center;align-items:center;gap:26px;margin:6px 0 10px}
#fpCtrls button{background:none;border:0;color:var(--txt);font-size:26px}
#fpPlayB{width:64px!important;height:64px;border-radius:50%!important;background:var(--gold)!important;color:#0a1830!important;font-size:26px!important}
#fpActs{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
#fpLyrics{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.75;white-space:pre-wrap;color:#ffffff}
#fpLyrics b{color:var(--gold2)}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet{position:relative;width:min(480px,100%);background:var(--card);border-radius:20px 20px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:70dvh;overflow-y:auto;border-top:1px solid var(--line)}
#sheet h3{font-size:15px;margin-bottom:4px}
#sheet .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.shbtn{display:flex;align-items:center;gap:12px;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;text-align:left}
.shbtn:active{border-color:var(--gold)}
/* forms & cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{font-size:14px;margin-bottom:8px}
.fld{margin:9px 0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:14px}
.fld textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;background:var(--gold);color:#0a1830;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin:10px 0}
.btn:active{opacity:.9}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.small{padding:9px;font-size:13px}
.row2{display:flex;gap:10px}
.row2 .btn{margin:6px 0}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.gold{color:var(--gold2)}
.plan{border:1px solid var(--gold);border-radius:14px;padding:14px;margin:10px 0;background:linear-gradient(180deg,#12203a,#0d1526)}
.plan b{font-size:17px;color:var(--gold2)}
.plan span{color:var(--mut);font-size:12px;display:block;margin-top:4px}
.copyrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:8px 0}
.copyrow b{font-size:17px;letter-spacing:1px;flex:1}
.copyrow button{background:var(--gold);border:0;border-radius:8px;padding:8px 14px;font-weight:700;color:#0a1830}
.steps{font-size:13px;line-height:1.9;color:#b3b3b3;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--mut)}
.listbtn{display:flex;width:100%;background:none;border:0;color:var(--txt);font-size:14px;padding:13px 4px;border-bottom:1px solid var(--line);align-items:center;gap:10px;text-align:left}
.listbtn .arw{margin-left:auto;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font-size:13px;font-weight:700}
.seg button.on{background:var(--gold);color:#0a1830}
/* search */
#searchInput{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15px;margin:8px 0 4px}
/* toast */
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2540;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fp[hidden],#sheetWrap[hidden],#mp[hidden]{display:none!important}
audio.prev{width:100%;margin:6px 0}
.hr{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--mut);font-size:12px}
.center{text-align:center}
/* ===== modern motion ===== */
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fpIn{from{transform:translate(-50%,70px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(77,163,255,0)}50%{box-shadow:0 0 20px 3px rgba(77,163,255,.45)}}
@keyframes shimmer{to{background-position:-200% 0}}
button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
button:active{transform:scale(.92)}
.view.on{animation:fadeUp .34s ease both}
.view.on .srow{animation:fadeUp .45s ease both}
.view.on .srow:nth-child(2){animation-delay:.05s}
.view.on .srow:nth-child(3){animation-delay:.1s}
.view.on .srow:nth-child(4){animation-delay:.15s}
.view.on .srow:nth-child(5){animation-delay:.2s}
.view.on .srow:nth-child(n+6){animation-delay:.25s}
#fp:not([hidden]){animation:fpIn .36s cubic-bezier(.2,.9,.25,1) both}
#tabbar button.on .ti{animation:pop .32s ease}
.eq{display:none;align-items:flex-end;gap:3px;height:18px;margin:0 4px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--gold);transform:scaleY(.25);transform-origin:bottom}
body.is-playing .eq{display:inline-flex}
body.is-playing .eq i{animation:eq .8s ease-in-out infinite}
body.is-playing .eq i:nth-child(2){animation-delay:.2s}
body.is-playing .eq i:nth-child(3){animation-delay:.42s}
body.is-playing .eq i:nth-child(4){animation-delay:.1s}
body.is-playing #fpCover{animation:spinSlow 16s linear infinite}
body.is-playing #mpPlay{animation:glowPulse 2.4s ease-in-out infinite}
.icobtn.pop{animation:pop .35s ease}
.loading{background:linear-gradient(90deg,var(--card2) 25%,#2a2a2a 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;color:transparent!important;border-radius:8px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Spotify-style theme ===== */
:root{--bg:#121212;--card:#181818;--card2:#2a2a2a;--gold:#1ed760;--gold2:#1ed760;--line:#2f2f2f}
#phone{background:#121212 linear-gradient(180deg,#1d6b43,#121212) no-repeat top/100% 400px}
svg{fill:currentColor}
#topbar{padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
.logo{width:40px;height:40px;border-radius:50%;background:none;padding:0}
.logo svg{width:100%;height:100%}
#topbar .tt b{font-size:20px;font-weight:800;letter-spacing:-.3px}
#greet{font-size:28px!important;letter-spacing:-.5px}
.sec-t{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:24px 0 12px}
.hcard,.artcard .art{border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.hcard{border:0}
.artcard .art{border:0}
.cover{border-radius:6px}
.cover::after,#fpCover::after{display:none}
.srow{padding:8px 4px}
.srow .mi b{font-size:15px;font-weight:700}
.icobtn{padding:6px}
.icobtn svg{width:22px;height:22px;display:block}
.icobtn.fav{color:#1ed760}
#searchInput{background:#fff;color:#000;border:0;border-radius:8px;font-weight:600;padding:14px}
#searchInput::placeholder{color:#727272}
.card{border:0;border-radius:10px;background:#181818}
.btn{border-radius:500px;color:#000;font-weight:800}
.btn.ghost{background:transparent;color:#fff;border:1px solid #727272}
.seg button.on,.copyrow button{color:#000}
.plan{background:linear-gradient(135deg,rgba(30,215,96,.28),#181818);border:0}
.copyrow{border-color:#1ed760}
#toast{background:#fff;color:#000;font-weight:700;border:0;bottom:calc(150px + env(safe-area-inset-bottom))}
/* tab bar */
#tabbar{background:linear-gradient(180deg,rgba(18,18,18,0),rgba(0,0,0,.96) 38%);border-top:0}
#tabbar button{color:#b3b3b3;font-weight:600}
#tabbar button.on{color:#fff}
#tabbar .ti svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.on .ti svg{stroke-width:2.7}
/* mini player */
#mp{bottom:calc(66px + env(safe-area-inset-bottom));border:0;border-radius:8px;background:#3a3a3a;padding:8px 10px 11px}
#mpPlay{background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
#mpPlay svg{width:20px;height:20px}
body.is-playing #mpPlay{animation:none}
#mpBar{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#mpBar i{display:block;height:100%;width:0;background:#fff}
/* full player */
#fp{padding-top:calc(14px + env(safe-area-inset-top))}
#fpTop button{display:flex}
#fpTop svg{width:26px;height:26px}
#fpTop span{letter-spacing:1px;font-weight:700}
body.is-playing #fpCover{animation:none}
#fpCover{width:min(340px,82vw);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.55)}
#fpTitle,#fpArtist{text-align:left}
#fpTitle{font-size:24px;letter-spacing:-.4px}
#fpSeek{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#535353;outline:0;margin:8px 0}
#fpSeek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
#fpSeek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
#fpCtrls{gap:30px}
#fpCtrls button{display:flex;align-items:center;justify-content:center}
#fpCtrls svg{width:28px;height:28px}
#fpPlayB{background:#fff!important;color:#000!important;display:flex;align-items:center;justify-content:center}
#fpPlayB svg{width:30px;height:30px}
#fpRepeat svg,#fpShuf svg,#fpSleep svg{width:24px;height:24px}
#fpShuf.on,#fpRepeat.on,#fpSleep.on{color:var(--gold2);opacity:1!important}
#fpLyrics{background:linear-gradient(160deg,#1f8a52,#14563a);border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:700;line-height:1.55;color:#fff}
#fpLyrics b{display:block;color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px}
.shbtn svg{width:20px;height:20px}
#offBanner{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:70;background:#fff;color:#000;font:700 12px/1.3 system-ui,sans-serif;text-align:center;padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
#installRow{margin:10px 0 14px}
.instCard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1ed760,#0e8f3c);color:#000;border-radius:14px;padding:12px 8px 12px 12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.instIco{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex:none}
.instIco svg{width:22px;height:22px}
.instTx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.instTx b{font-size:15px}.instTx span{font-size:12px;opacity:.8}
#installBtn{background:#000;color:#fff;border:0;border-radius:500px;font-family:inherit;font-weight:700;font-size:13px;padding:9px 16px;cursor:pointer;flex:none}
#installX{background:none;border:0;color:#000;padding:6px;display:flex;cursor:pointer;opacity:.7;flex:none}
#installX svg{width:16px;height:16px}
.instPill{display:inline-flex;align-items:center;background:rgba(255,255,255,.14);border-radius:500px}
.instPill button{display:flex;align-items:center;gap:7px;background:none;border:0;color:#fff;font-family:inherit;font-weight:700;font-size:13px;padding:9px 12px;cursor:pointer}
.instPill svg{width:16px;height:16px}
#installX{color:#b3b3b3;padding:9px 11px 9px 2px}

/* ===== artist upload wizard ===== */
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.wiz h3{font-size:18px;margin-bottom:4px}
.step{display:flex;gap:12px;align-items:center;margin:20px 0 8px}
.step b{font-size:15px}
.stepn{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#000;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;border:2px dashed var(--gold);border-radius:14px;padding:24px 12px;text-align:center;background:var(--card2);cursor:pointer;color:var(--txt)}
.drop.ok{border-style:solid;background:rgba(30,215,96,.12)}
.drop svg{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:15px}
.drop small{color:var(--mut);font-size:12px;word-break:break-all}
.prog{display:none;height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--mut);margin:14px 0 4px}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:#1ed760;flex:none}
.note.warn,.warn{color:#f0938d}
.okcard{text-align:center}
.okcard .note{margin-bottom:6px}
details.more>summary{cursor:pointer;font-weight:700;font-size:14px;padding:4px 0}
.pill.a{background:#123a24;color:#7fe0a8}
</style>
</head>
<body>

  }

}

function updateMediaSession(){
  if(!("mediaSession" in navigator)) return;
  const s=Player.song();
  if(!s){ navigator.mediaSession.metadata=null; return; }
  try{
    const art=s.coverUrl?[{src:s.coverUrl,sizes:"512x512"}]:[{src:"icon-192.png",sizes:"192x192",type:"image/png"}];
    navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.worshiper||s.artist||"",album:"ES — Ethiopian Songs",artwork:art});
    navigator.mediaSession.playbackState=Player.playing?"playing":"paused";
  }catch(e){}
}
(function initMediaSession(){
  if(!("mediaSession" in navigator)) return;
  const set=(a,fn)=>{ try{ navigator.mediaSession.setActionHandler(a,fn); }catch(e){} };
  set("play",()=>{ if(!Player.playing) Player.toggle(); });
  set("pause",()=>{ if(Player.playing) Player.toggle(); });
  set("previoustrack",()=>Player.prev());
  set("nexttrack",()=>Player.next());
  set("seekto",d=>{ const dur=Player.dur(); if(dur>0&&d.seekTime!=null) Player.seek(d.seekTime/dur); });
  set("seekforward",d=>{ const dur=Player.dur(); if(dur>0) Player.seek(Math.min(1,(Player.pos()+(d.seekOffset||10))/dur)); });
  set("seekbackward",d=>{ const dur=Player.dur(); if(dur>0) Player.seek(Math.max(0,(Player.pos()-(d.seekOffset||10))/dur)); });
  setInterval(()=>{
    const dur=Player.dur();
    if(dur>0&&Player.song()&&Player.song().kind!=="synth"){
      try{ navigator.mediaSession.setPositionState({duration:dur,playbackRate:1,position:Math.min(dur,Player.pos())}); }catch(e){}
    }
  },1000);
})();

/* ================= DOWNLOADS ================= */
function safeName(s){ return (s||"song").replace(/[^\w\-. ]+/g,"").trim().slice(0,60)||"song"; }
async function downloadSong(s){
  if(!S.user){ toast(t("dlSignIn")); switchTab("account"); return; }
  if(s.kind==="local"){ toast(t("dlDone")); return; }
  if(!isPremium && dlCount>=10 && !(serverDl&&serverDl.has(s.id))){ toast(t("dlLimit")); switchTab("account"); return; }
  toast("⏳");
  let reserved=false;
  if(supa && S.user && !(serverDl&&serverDl.has(s.id))){
    try{
      const {error}=await supa.from("downloads").upsert({user_id:S.user.id,song_id:s.id},{onConflict:"user_id,song_id",ignoreDuplicates:true});
      if(error){
        if(/download_limit/i.test(error.message||"")){ toast(t("dlLimit")); switchTab("account"); await loadServerDownloads(); return; }
        throw error;
      }
      reserved=true; if(serverDl) serverDl.add(s.id);
    }catch(e){ toast(t("errNet")); return; }
  }
  const undo=async()=>{ if(reserved){ try{ await supa.from("downloads").delete().eq("song_id",s.id); }catch(e){} if(serverDl) serverDl.delete(s.id); } };
  try{
    let blob, name;
    if(s.kind==="synth"){
      blob=await Synth.renderWav(s.synth); name=safeName(s.title)+".wav";
    }else{
      const r=await fetch(s.url);
      if(!r.ok) throw new Error("fetch");
      blob=await r.blob(); name=safeName(s.title)+(s.url.match(/\.\w{2,4}(\?|$)/)?.[0]||".mp3");
    }
    let cblob=null;
    if(s.coverUrl){ try{ const cr=await fetch(s.coverUrl); if(cr.ok) cblob=await cr.blob(); }catch(e){} }
    try{ await OffDB.put(s, blob, cblob); s._offUrl=null; }
    catch(e){ await undo(); toast(lang==="am"?"ማስቀመጥ አልተቻለም (ማከማቻ ሞልቷል?)":"Couldn't save on this device (storage full?)"); return; }
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    /* saved inside the app only (no file is handed to the phone) */
    dlCount++; Store.set("egs_dl",dlCount);
    try{ await refreshDisabled(); }catch(e){}
    try{ await syncOffline(); }catch(e){}
    toast(t("dlDone"));
  }catch(e){ await undo(); toast(t("errNet")); }
}

/* ================= COPY HELPER ================= */
function copyText(txt){
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  ta.remove();
}

async function uploadFileProgress(bucket, path, file, onProgress){
  const {data:{session}}=await supa.auth.getSession();
  const token=session&&session.access_token?session.access_token:SUPA_KEY;
  return new Promise((resolve,reject)=>{
    try{
      const xhr=new XMLHttpRequest();
      xhr.open("POST",SUPA_URL+"/storage/v1/object/"+bucket+"/"+path);
      xhr.setRequestHeader("apikey",SUPA_KEY);
      xhr.setRequestHeader("Authorization","Bearer "+token);
      if(file.type) xhr.setRequestHeader("Content-Type",file.type);
      xhr.upload.onprogress=(e)=>{ if(e.lengthComputable&&onProgress){ try{onProgress(Math.round(e.loaded/e.total*100));}catch(_){} } };
      xhr.onload=()=>{ (xhr.status>=200&&xhr.status<300)?resolve():reject(new Error("Upload failed ("+xhr.status+")")); };
      xhr.onerror=()=>reject(new Error("Network error"));
      xhr.send(file);
    }catch(e){ reject(e); }
  });
}

const MAX_AUDIO_MB = 50;

   false = every artist song waits for admin approval first */
const ARTIST_AUTO_PUBLISH = true;
function uploadStatus(){ return ((S.profile && S.profile.is_admin) || ARTIST_AUTO_PUBLISH) ? "approved" : "pending"; }
function fmtMB(b){ return (b/1048576).toFixed(1)+" MB"; }
function isAudioFile(f){ return /^audio\//.test(f.type||"") || /\.(mp3|m4a|wav|ogg|aac|opus|flac|wma)$/i.test(f.name||""); }
function niceTitle(n){ return (n||"").replace(/\.[^.]+$/,"").replace(/[_\-]+/g," ").replace(/\s+/g," ").trim(); }
function safeKey(n){ return (n||"file").replace(/[^\w.\-]+/g,"_"); }

    note.classList.add("warn");
    if(!navigator.onLine){ note.textContent="⚠ "+t("offlineUp"); return; }
    if(!files.length){ note.textContent="⚠ "+t("upNeedAudio"); return; }
    if(!artist&&!worshiper){ note.textContent="⚠ "+t("upNeedArtist"); return; }
    if(files.some(f=>!isAudioFile(f))){ note.textContent="⚠ "+t("upNotAudio"); return; }
    if(files.some(f=>f.size>MAX_AUDIO_MB*1048576)){ note.textContent="⚠ "+t("upTooBig"); return; }
    if(!q("#bRights").checked){ note.textContent="⚠ "+t("upNeedRights"); return; }
    note.classList.remove("warn"); btn.disabled=true;
    /* match photos/lyrics to songs by file name (melkam-neh.mp3 + melkam-neh.jpg + melkam-neh.txt) */
    const baseKey=n=>(n||"").replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9\u1200-\u137f]+/g,"");
    const photoMap={}, lyrMap={};
    photoFiles.forEach(f=>{ const k=baseKey(f.name); if(k&&!photoMap[k]) photoMap[k]=f; });
    lyricFiles.forEach(f=>{ const k=baseKey(f.name); if(k&&!lyrMap[k]) lyrMap[k]=f; });
    let ok=0, lastErr=""; const newIds=[];
    for(let i=0;i<files.length;i++){
      const file=files[i]; let path=null, inserted=false;
      note.textContent=t("bulkProg")+" "+(i+1)+"/"+files.length+"…";
      try{
        const title=niceTitle(file.name)||("Song "+(i+1));
        path=S.user.id+"/"+Date.now()+"_"+i+"_"+safeKey(file.name);
        await uploadFileProgress("songs-audio",path,file,pct=>{ note.textContent=t("bulkProg")+" "+(i+1)+"/"+files.length+"… "+pct+"%"; });
        const audioUrl=supa.storage.from("songs-audio").getPublicUrl(path).data.publicUrl;
        const k=baseKey(file.name); let coverUrl=null, lyrics=null;
        const pf=photoMap[k];
        if(pf && pf.size<8*1048576){
          try{
            const cp=S.user.id+"/covers/"+Date.now()+"_"+i+"_"+safeKey(pf.name);
            await uploadFileProgress("songs-audio",cp,pf,null);
            coverUrl=supa.storage.from("songs-audio").getPublicUrl(cp).data.publicUrl;
          }catch(e){}
        }
        const lf=lyrMap[k];
        if(lf){ try{ lyrics=(await lf.text()).replace(/\[\d{1,3}:\d{2}(\.\d{1,3})?\]/g,"").trim().slice(0,20000)||null; }catch(e){} }
        const id=await insertSong({title:title,artist_name:(artist||worshiper||"Unknown"),worshiper:worshiper,cover_url:coverUrl,lyrics:lyrics,audio_url:audioUrl,uploader_id:S.user.id,status:uploadStatus()});
        inserted=true; if(id!=null) newIds.push("sb-"+id); ok++;
      }catch(e){
        lastErr=upErrText(e);
        if(path&&!inserted){ try{ await supa.storage.from("songs-audio").remove([path]); }catch(_){} }
      }
    }
    btn.disabled=false; note.textContent=(lastErr&&!ok)?("⚠ "+lastErr):"";
    ["#bFiles","#bPhotos","#bLyrics"].forEach(s=>{ q(s).value=""; }); q("#bPlaylist").value=""; q("#bRights").checked=false;
    await loadMyUploads(); await loadApproved();
    if(plName&&newIds.length){
      let p=playlists.find(x=>(x.name||"").toLowerCase()===plName.toLowerCase());
      if(!p){ p={id:"pl"+Date.now(),name:plName,items:[]}; playlists.push(p); }
      newIds.forEach(id=>{ if(!p.items.includes(id)) p.items.push(id); });
      savePls();
    }
    renderMyUploadsBox(); renderLibrary(); renderHome();
    toast(ok ? t(uploadStatus()==="approved"?"bulkDoneLive":"bulkDone")+" ("+ok+"/"+files.length+")" : ("⚠ "+(lastErr||t("errUpload"))));
  });
}

async function deleteSong(id,audioUrl,coverUrl){
  if(!confirm(t("confirmDelete"))) return;
  try{
    const paths=[audioUrl,coverUrl].map(u=>((u||"").split("/songs-audio/")[1]||"").split("?")[0]).filter(Boolean).map(decodeURIComponent);
    const {error}=await supa.from("songs").delete().eq("id",id);

async function doGrantPremium(days){
  const box=$("#adminBox");
  const emEl=box.querySelector("#gpEmail"), note=box.querySelector("#gpNote");
  const email=(emEl.value||"").trim().toLowerCase();
  note.textContent="";
  if(!email){ note.textContent=t("userNotFound"); return; }
  note.textContent="⏳";
  try{
    const {data,error}=await supa.from("profiles").select("id,premium_until").eq("email",email).single();
    if(error||!data) throw new Error("notfound");
    const base=Math.max(Date.now(), data.premium_until?new Date(data.premium_until).getTime():0);
    const until=new Date(base+days*86400000).toISOString();
    const {error:uerr}=await supa.from("profiles").update({premium_until:until}).eq("id",data.id);
    if(uerr) throw uerr;
    emEl.value=""; note.textContent=t("premGranted")+" ✓"; toast(t("premGranted"));
  }catch(e){ note.textContent=t("userNotFound"); }
}

/* ================= AUTH INIT ================= */
async function initAuth(){
  try{
    const qp=new URLSearchParams(location.search);
    const oerr=qp.get("error");
    if(oerr){
      S.oauthError=(qp.get("error_description")||oerr).replace(/\+/g," ");
      try{ history.replaceState(null,"",location.pathname); }catch(e){}
      toast("⚠ "+S.oauthError);
    }
  }catch(e){}
  try{
    const {data}=await supa.auth.getSession();
    if(data&&data.session){ S.user=data.session.user; await refreshAfterAuth(); }
    else if(navigator.onLine){ isPremium=false; Store.set("egs_prem_until",0); }
  }catch(e){}
  supa.auth.onAuthStateChange(async(_ev,session)=>{
    const nu=session?session.user:null;
    const changed=(nu?nu.id:null)!==(S.user?S.user.id:null);
    S.user=nu;
    if(!changed) return;
    if(S.user){ await refreshAfterAuth(); } else { S.profile=null; S.myUploads=[]; S.pending=[]; S.notifs=[]; serverDl=null; isPremium=false; Store.set("egs_prem_until",0); renderAccount(); }
  });
}
