<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EGS">

<title>EGS — Ethiopian Gospel Music</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:linear-gradient(180deg,#0b3d20 0%,#4d3f10 52%,#4d1518 100%);--card:#181818;--card2:#282828;--gold:#1DB954;--gold2:#1ED760;--txt:#ffffff;--mut:#b3b3b3;--line:#2a2a2a;--green:#1DB954;--red:#e0655f;--blue:#5f9de0}
html,body{height:100%}
body{background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic","Nyala",sans-serif;display:flex;justify-content:center}
#phone{width:100%;max-width:480px;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:170px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
/* top bar */
#topbar{padding:18px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#FCDD09,#DAA520);color:#0a1830;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;flex:none}
#topbar .tt b{font-size:17px;display:block}
#topbar .tt span{font-size:12px;color:var(--mut)}
/* views */
.view{display:none;padding:6px 16px 20px}
.view.on{display:block}
.sec-t{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-t small{font-weight:400;color:var(--mut);font-size:12px}
/* horizontal cards */
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hcard{flex:0 0 128px;height:150px;border-radius:14px;position:relative;overflow:hidden;border:1px solid var(--line);text-align:left;color:var(--txt);padding:0}
.hcard .cv{position:absolute;inset:0}
.hcard .lb{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hcard .lb small{display:block;font-weight:400;color:#b3b3b3;font-size:11px}
/* song rows */
.srow{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px;width:100%;background:none;border:0;color:var(--txt);text-align:left}
.srow:active{background:var(--card)}
.cover{width:52px;height:52px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff8;text-shadow:0 1px 4px rgba(0,0,0,.5);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,255,255,.07) 7px 9px)}
.srow .mi{flex:1;min-width:0}
.srow .mi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .mi span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.icobtn{background:none;border:0;color:var(--mut);font-size:19px;padding:8px;border-radius:10px}
.icobtn:active{background:var(--card2)}
.icobtn.fav{color:var(--gold)}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700}
.pill.p{background:#2a2a2a;color:var(--gold2)}
.pill.a{background:#123a24;color:#7fe0a8}
.pill.r{background:#3a1a18;color:#f0938d}
/* tab bar */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:rgba(10,12,17,.97);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabbar button .ti{font-size:21px}
#tabbar button.on{color:var(--gold)}
/* mini player */
#mp{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);width:min(460px,94%);background:var(--card2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 10px;z-index:39;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#mp .cover{width:44px;height:44px}
#mp .mi{flex:1;min-width:0}
#mp .mi b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mp .mi span{font-size:11px;color:var(--mut)}
#mpPlay{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);color:#0a1830;font-size:17px;flex:none}
/* full player */
#fp{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:100dvh;background:linear-gradient(180deg,#282828,#121212 60%);z-index:60;display:flex;flex-direction:column;padding:14px 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
#fpTop{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
#fpTop button{background:none;border:0;color:var(--txt);font-size:22px}
#fpTop span{font-size:12px;color:var(--mut);letter-spacing:2px}
#fpCover{width:min(300px,72vw);aspect-ratio:1;border-radius:18px;margin:8px auto 16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;color:#fff9;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#fpCover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.06) 14px 17px)}
#fpTitle{font-size:21px;font-weight:800;text-align:center}
#fpArtist{font-size:14px;color:var(--mut);text-align:center;margin:4px 0 12px}
#fpSeek{width:100%;accent-color:var(--gold)}
#fpTimes{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:2px 0 8px}
#fpCtrls{display:flex;justify-content:center;align-items:center;gap:26px;margin:6px 0 10px}
#fpCtrls button{background:none;border:0;color:var(--txt);font-size:26px}
#fpPlayB{width:64px!important;height:64px;border-radius:50%!important;background:var(--gold)!important;color:#0a1830!important;font-size:26px!important}
#fpActs{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
#fpLyrics{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.75;white-space:pre-wrap;color:#ffffff}
#fpLyrics b{color:var(--gold2)}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
#sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet{position:relative;width:min(480px,100%);background:var(--card);border-radius:20px 20px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:70dvh;overflow-y:auto;border-top:1px solid var(--line)}
#sheet h3{font-size:15px;margin-bottom:4px}
#sheet .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.shbtn{display:flex;align-items:center;gap:12px;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;text-align:left}
.shbtn:active{border-color:var(--gold)}
/* forms & cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{font-size:14px;margin-bottom:8px}
.fld{margin:9px 0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:14px}
.fld textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;background:var(--gold);color:#0a1830;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin:10px 0}
.btn:active{opacity:.9}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.small{padding:9px;font-size:13px}
.row2{display:flex;gap:10px}
.row2 .btn{margin:6px 0}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.gold{color:var(--gold2)}
.plan{border:1px solid var(--gold);border-radius:14px;padding:14px;margin:10px 0;background:linear-gradient(180deg,#12203a,#0d1526)}
.plan b{font-size:17px;color:var(--gold2)}
.plan span{color:var(--mut);font-size:12px;display:block;margin-top:4px}
.copyrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:8px 0}
.copyrow b{font-size:17px;letter-spacing:1px;flex:1}
.copyrow button{background:var(--gold);border:0;border-radius:8px;padding:8px 14px;font-weight:700;color:#0a1830}
.steps{font-size:13px;line-height:1.9;color:#b3b3b3;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--mut)}
.listbtn{display:flex;width:100%;background:none;border:0;color:var(--txt);font-size:14px;padding:13px 4px;border-bottom:1px solid var(--line);align-items:center;gap:10px;text-align:left}
.listbtn .arw{margin-left:auto;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font-size:13px;font-weight:700}
.seg button.on{background:var(--gold);color:#0a1830}
/* search */
#searchInput{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15px;margin:8px 0 4px}
/* toast */
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2540;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fp[hidden],#sheetWrap[hidden],#mp[hidden]{display:none!important}
audio.prev{width:100%;margin:6px 0}
.hr{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--mut);font-size:12px}
.center{text-align:center}
/* ===== modern motion ===== */
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fpIn{from{transform:translate(-50%,70px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(77,163,255,0)}50%{box-shadow:0 0 20px 3px rgba(77,163,255,.45)}}
@keyframes shimmer{to{background-position:-200% 0}}
button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
button:active{transform:scale(.92)}
.view.on{animation:fadeUp .34s ease both}
.view.on .srow{animation:fadeUp .45s ease both}
.view.on .srow:nth-child(2){animation-delay:.05s}
.view.on .srow:nth-child(3){animation-delay:.1s}
.view.on .srow:nth-child(4){animation-delay:.15s}
.view.on .srow:nth-child(5){animation-delay:.2s}
.view.on .srow:nth-child(n+6){animation-delay:.25s}
#fp:not([hidden]){animation:fpIn .36s cubic-bezier(.2,.9,.25,1) both}
#tabbar button.on .ti{animation:pop .32s ease}
.eq{display:none;align-items:flex-end;gap:3px;height:18px;margin:0 4px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--gold);transform:scaleY(.25);transform-origin:bottom}
body.is-playing .eq{display:inline-flex}
body.is-playing .eq i{animation:eq .8s ease-in-out infinite}
body.is-playing .eq i:nth-child(2){animation-delay:.2s}
body.is-playing .eq i:nth-child(3){animation-delay:.42s}
body.is-playing .eq i:nth-child(4){animation-delay:.1s}
body.is-playing #fpCover{animation:spinSlow 16s linear infinite}
body.is-playing #mpPlay{animation:glowPulse 2.4s ease-in-out infinite}
.icobtn.pop{animation:pop .35s ease}
.loading{background:linear-gradient(90deg,var(--card2) 25%,#2a2a2a 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;color:transparent!important;border-radius:8px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div id="mp" hidden>
    <div class="cover" id="mpCover">♪</div>
    <div class="mi"><b id="mpTitle"></b><span id="mpArtist"></span></div>

  </div>

  <nav id="tabbar">
    <button data-tab="home" class="on"><span class="ti">⌂</span><span data-i18n="home">Home</span></button>
    <button data-tab="search"><span class="ti">⌕</span><span data-i18n="search">Search</span></button>
    <button data-tab="library"><span class="ti">♫</span><span data-i18n="library">Library</span></button>
    <button data-tab="account"><span class="ti">◉</span><span data-i18n="account">Account</span></button>
  </nav>

  <div id="fp" hidden>
    <div id="fpTop"><button id="fpClose">﹀</button><span data-i18n="nowPlaying">NOW PLAYING</span><button id="fpMore">⋯</button></div>
    <div id="fpCover">♪</div>
    <div id="fpTitle"></div>
    <div id="fpArtist"></div>
    <input type="range" id="fpSeek" min="0" max="1000" value="0">
    <div id="fpTimes"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
    <div id="fpCtrls">
      <button id="fpPrev">⏮</button>

    <div id="fpActs">

    <div class="sec-t"><span data-i18n="lyrics">Lyrics</span></div>
    <div id="fpLyrics"></div>
  </div>

  <div id="sheetWrap" hidden><div id="sheetBg"></div><div id="sheet"><div id="sheetBody"></div></div></div>
  <div id="toast"></div>
</div>

/* ================= BUILT-IN HYMNS (public domain) ================= */
/* Melodies are simple original synthesized arrangements (midi, beats). */
const HYMNS = [];
HYMNS.forEach(h=>{ h.kind="synth"; h.source="builtin";
  const ev=[]; let b=0;
  h.mel.forEach(([m,beats])=>{ ev.push({b:b,m:m,d:beats,k:"lead"}); b+=beats; });
  let bb=0; h.bass.forEach(([m,beats])=>{ ev.push({b:bb,m:m,d:beats,k:"bass"}); bb+=beats; });
  h.events=ev; h.totalBeats=b; h.loopSec=b*60/h.bpm;
});
function hymnSong(h){ return {id:h.id,title:h.title,artist:h.artist,kind:"synth",source:"builtin",lyrics:h.lyrics,hue:h.hue,synth:h}; }

/* ================= SYNTH ENGINE ================= */
const Synth = {
  ctx:null, timer:null, noiseBuf:null,
  track:null, playing:false, secPerBeat:0.5, loopBeats:0,
  startBeat:0, startCtxT:0, nextBeat:0, nextT:0, pausedBeat:0,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 0.1, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf = buf;
    }
    if(this.ctx.state==="suspended") this.ctx.resume();
    return this.ctx;
  },
  note(midi, time, dur, kind){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type = kind==="bass" ? "sine" : "triangle";
    o.frequency.value = midiHz(midi);
    const vol = kind==="bass" ? 0.22 : 0.16;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, time+Math.max(0.08,dur*0.95));
    o.connect(g); g.connect(c.destination);
    o.start(time); o.stop(time+dur+0.05);
  },
  kick(time){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(110,time);
    o.frequency.exponentialRampToValueAtTime(45,time+0.1);
    g.gain.setValueAtTime(0.28,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.13);
    o.connect(g); g.connect(c.destination); o.start(time); o.stop(time+0.15);
  },
  hat(time){
    const c=this.ctx, s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
    s.buffer=this.noiseBuf; f.type="highpass"; f.frequency.value=6500;
    g.gain.setValueAtTime(0.05,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(time); s.stop(time+0.06);
  },
  playBeat(beat, time, track){
    for(const e of track.events){
      if(Math.abs(e.b-beat)<1e-6) this.note(e.m, time, e.d*this.secPerBeat, e.k);
    }
    if(Math.abs(beat-Math.round(beat))<1e-6) this.kick(time);
    else if(Math.abs(beat*2-Math.round(beat*2))<1e-6) this.hat(time);
  },
  schedule(){
    const c=this.ctx; if(!c) return;
    while(this.nextT < c.currentTime + 0.35){
      this.playBeat(this.nextBeat, this.nextT, this.track);
      this.nextBeat += 0.25; this.nextT += 0.25*this.secPerBeat;
      if(this.nextBeat >= this.loopBeats - 1e-6){
        this.nextBeat -= this.loopBeats;
        this.startCtxT += this.loopBeats*this.secPerBeat;
        this.startBeat = 0;
      }
    }
  },
  play(track, fromBeat){
    this.ensure(); this.stopTimer();
    this.track=track; this.secPerBeat=60/track.bpm; this.loopBeats=track.totalBeats;
    this.startBeat=fromBeat||0; this.startCtxT=this.ctx.currentTime+0.08;
    this.nextBeat=this.startBeat; this.nextT=this.startCtxT; this.playing=true;
    this.timer=setInterval(()=>this.schedule(), 90);
    this.schedule();
  },
  stopTimer(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  pause(){ if(this.playing){ this.pausedBeat=this.position(); } this.stopTimer(); this.playing=false; },
  stop(){ this.stopTimer(); this.playing=false; this.track=null; },
  position(){
    if(!this.ctx || !this.track) return this.pausedBeat||0;
    if(!this.playing) return this.pausedBeat||0;
    let b = this.startBeat + (this.ctx.currentTime-this.startCtxT)/this.secPerBeat;

  renderWav(track){
    const sr=22050, dur=track.loopSec, len=Math.ceil(sr*dur);
    const oc=new OfflineAudioContext(1,len,sr);
    const spb=60/track.bpm;
    const note=(midi,time,durS,kind)=>{
      const o=oc.createOscillator(), g=oc.createGain();
      o.type=kind==="bass"?"sine":"triangle"; o.frequency.value=midiHz(midi);
      const vol=kind==="bass"?0.22:0.16;
      g.gain.setValueAtTime(0.0001,time);
      g.gain.exponentialRampToValueAtTime(vol,time+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,time+Math.max(0.08,durS*0.95));
      o.connect(g); g.connect(oc.destination); o.start(time); o.stop(time+durS+0.05);
    };
    const kick=time=>{
      const o=oc.createOscillator(), g=oc.createGain();
      o.type="sine"; o.frequency.setValueAtTime(110,time);
      o.frequency.exponentialRampToValueAtTime(45,time+0.1);
      g.gain.setValueAtTime(0.25,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.13);
      o.connect(g); g.connect(oc.destination); o.start(time); o.stop(time+0.15);
    };
    for(const e of track.events){
      note(e.m, e.b*spb, e.d*spb, e.k);
      if(Math.abs(e.b-Math.round(e.b))<1e-6) kick(e.b*spb);
    }
    return oc.startRendering().then(buf=>{
      const n=buf.length, data=buf.getChannelData(0);
      const ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
      const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
      ws(0,"RIFF"); v.setUint32(4,36+n*2,true); ws(8,"WAVE"); ws(12,"fmt ");
      v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
      v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
      ws(36,"data"); v.setUint32(40,n*2,true);
      for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,data[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
      return new Blob([ab],{type:"audio/wav"});
    });
  }
};

const Store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let favs = Store.get("egs_favs", []);
let playlists = Store.get("egs_playlists", []);
const OffDB = {
  _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      try{
        const r=indexedDB.open("egs-offline",1);
        r.onupgradeneeded=()=>{ r.result.createObjectStore("songs",{keyPath:"id"}); };
        r.onsuccess=()=>{ this._db=r.result; res(this._db); };
        r.onerror=()=>rej(r.error||new Error("idb"));
      }catch(e){ rej(e); }
    });
  },
  async put(song,blob){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const tx=db.transaction("songs","readwrite");
      tx.objectStore("songs").put({id:song.id,title:song.title,artist:song.artist||"",blob:blob,savedAt:Date.now()});
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  },
  async get(id){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const q=db.transaction("songs","readonly").objectStore("songs").get(id);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
    });
  },
  async clear(){
    try{
      const db=await this.open();
      await new Promise((res)=>{ const tx=db.transaction("songs","readwrite"); tx.objectStore("songs").clear(); tx.oncomplete=res; tx.onerror=res; });
    }catch(e){}
  },
  async all(){
    const db=await this.open();
    return new Promise((res,rej)=>{
      const q=db.transaction("songs","readonly").objectStore("songs").getAll();
      q.onsuccess=()=>{ const r=q.result||[]; r.sort((a,b)=>(a.savedAt||0)-(b.savedAt||0)); res(r); };
      q.onerror=()=>rej(q.error);
    });
  },
  async remove(id){
    try{
      const db=await this.open();
      await new Promise((res)=>{ const tx=db.transaction("songs","readwrite"); tx.objectStore("songs").delete(id); tx.oncomplete=res; tx.onerror=res; });
    }catch(e){}
  },
  async offlineUrl(s){
    if(s._offUrl) return s._offUrl;
    try{
      const rec=await this.get(s.id);
      if(rec&&rec.blob){ s._offUrl=URL.createObjectURL(rec.blob); return s._offUrl; }
    }catch(e){}
    return null;
  }
};

/* ================= UNIFIED PLAYER ================= */
const audioEl = new Audio();
audioEl.preload="metadata";
const Player = {
  q:[], i:-1, playing:false,
  song(){ return (this.i>=0 && this.i<this.q.length) ? this.q[this.i] : null; },
  playQueue(list, idx){
    if(!list.length) return;
    this.q=list.slice(); this.i=Math.max(0,idx); this._start();
  },
  _start(){
    const s=this.song(); if(!s) return;
    audioEl.pause(); Synth.stop();
    if(s.kind==="synth"){ Synth.play(s.synth, 0); this.playing=true; syncPlayerUI(); return; }
    OffDB.offlineUrl(s).then(offUrl=>{
      if(this.song()!==s) return;
      const url = s.kind==="local" ? s.objUrl : (offUrl||s.url);
      if(audioEl.getAttribute("data-u")!==url){ audioEl.setAttribute("data-u",url); audioEl.src=url; }
      audioEl.play().catch(()=>toast(t("errNet")));
      this.playing=true; syncPlayerUI();
    });
  },
  toggle(){
    const s=this.song(); if(!s) return;
    if(this.playing){
      if(s.kind==="synth") Synth.pause(); else audioEl.pause();
      this.playing=false;
    }else{
      if(s.kind==="synth"){ Synth.ensure(); Synth.play(s.synth, Synth.pausedBeat||0); }
      else audioEl.play().catch(()=>toast(t("errNet")));
      this.playing=true;
    }
    syncPlayerUI();
  },
  next(){ if(!this.q.length) return; this.i=(this.i+1)%this.q.length; this._start(); },
  prev(){
    if(!this.q.length) return;
    const pos=this.pos();
    if(pos>3){ this.seek(0); return; }
    this.i=(this.i-1+this.q.length)%this.q.length; this._start();
  },
  seek(frac){
    const s=this.song(); if(!s) return;
    if(s.kind==="synth") Synth.seek(frac*s.synth.totalBeats);
    else if(isFinite(audioEl.duration)&&audioEl.duration>0) audioEl.currentTime=frac*audioEl.duration;
  },
  pos(){ const s=this.song(); if(!s) return 0;
    if(s.kind==="synth") return Synth.position()* (60/s.synth.bpm);
    return audioEl.currentTime||0; },
  dur(){ const s=this.song(); if(!s) return 0;
    if(s.kind==="synth") return s.synth.loopSec;
    return (isFinite(audioEl.duration)&&audioEl.duration>0)?audioEl.duration:0; }
};
audioEl.addEventListener("ended", ()=>Player.next());

  const s=Player.song(), mp=$("#mp");

/* ================= DOWNLOADS ================= */
function safeName(s){ return (s||"song").replace(/[^\w\-. ]+/g,"").trim().slice(0,60)||"song"; }
async function downloadSong(s){
  if(!S.user){ toast(t("dlSignIn")); switchTab("account"); return; }
  if(s.kind==="local"){ toast(t("dlDone")); return; }
  toast("⏳");
  try{
    let blob, name;
    if(s.kind==="synth"){
      blob=await Synth.renderWav(s.synth); name=safeName(s.title)+".wav";
    }else{
      const r=await fetch(s.url);
      if(!r.ok) throw new Error("fetch");
      blob=await r.blob(); name=safeName(s.title)+(s.url.match(/\.\w{2,4}(\?|$)/)?.[0]||".mp3");
    }
    try{ await OffDB.put(s, blob); s._offUrl=null; }catch(e){}
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
    try{ renderDownloads(); }catch(e){}
    toast(t("dlDone"));
  }catch(e){ toast(t("errNet")); }
}

/* ================= COPY HELPER ================= */
function copyText(txt){
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  ta.remove();
}

async function uploadFileProgress(bucket, path, file, onProgress){
  const {data:{session}}=await supa.auth.getSession();
  const token=session&&session.access_token?session.access_token:SUPA_KEY;
  return new Promise((resolve,reject)=>{
    try{
      const xhr=new XMLHttpRequest();
      xhr.open("POST",SUPA_URL+"/storage/v1/object/"+bucket+"/"+path);
      xhr.setRequestHeader("apikey",SUPA_KEY);
      xhr.setRequestHeader("Authorization","Bearer "+token);
      if(file.type) xhr.setRequestHeader("Content-Type",file.type);
      xhr.upload.onprogress=(e)=>{ if(e.lengthComputable&&onProgress){ try{onProgress(Math.round(e.loaded/e.total*100));}catch(_){} } };
      xhr.onload=()=>{ (xhr.status>=200&&xhr.status<300)?resolve():reject(new Error("Upload failed ("+xhr.status+")")); };
      xhr.onerror=()=>reject(new Error("Network error"));
      xhr.send(file);
    }catch(e){ reject(e); }
  });
}

  try{
    const qp=new URLSearchParams(location.search);
    const oerr=qp.get("error");
    if(oerr){
      S.oauthError=(qp.get("error_description")||oerr).replace(/\+/g," ");
      try{ history.replaceState(null,"",location.pathname); }catch(e){}
      toast("⚠ "+S.oauthError);
    }
  }catch(e){}
  try{
    const {data}=await supa.auth.getSession();
    if(data&&data.session){ S.user=data.session.user; await refreshAfterAuth(); }
  }catch(e){}
  supa.auth.onAuthStateChange(async(_ev,session)=>{
    const nu=session?session.user:null;
    const changed=(nu?nu.id:null)!==(S.user?S.user.id:null);
    S.user=nu;
    if(!changed) return;
    if(S.user){ await refreshAfterAuth(); } else { S.profile=null; S.myUploads=[]; S.pending=[]; renderAccount(); }
  });
}

/* ================= PWA INSTALL BANNER ================= */
let deferredPrompt=null;
function maybeShowInstall(){
  try{
    if(localStorage.getItem("egs_install_x")) return;
    if(window.matchMedia("(display-mode: standalone)").matches) return;
    $("#installBanner").style.display="block";
  }catch(e){}
}
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); deferredPrompt=e; maybeShowInstall(); });
document.addEventListener("DOMContentLoaded",()=>{
  const x=$("#installX"); if(x) x.addEventListener("click",()=>{ try{localStorage.setItem("egs_install_x","1");}catch(e){} $("#installBanner").style.display="none"; });
  const b=$("#installBtn"); if(b) b.addEventListener("click",async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("#installBanner").style.display="none"; } });
  setTimeout(()=>{ if(deferredPrompt) maybeShowInstall(); },3000);
});

/* ================= INIT ================= */
applyI18n();
renderHome();
renderSearchList("");
renderLibrary();
renderAccount();
if(supa){ initAuth(); loadApproved(); }
</script>
