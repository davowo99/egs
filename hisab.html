<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hisab Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#071f14; color:#eafff2; padding:14px 14px 30px; }
  .head { display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#0d3520,#0a2a19); border:1px solid #175732; border-radius:18px; padding:14px; }
  .logo { width:52px; height:52px; border-radius:14px; background:#0f5132; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; color:#2fe673; border:1px solid #1d7a46; flex:none; }
  .shopname { font-size:19px; font-weight:800; line-height:1.2; }
  .subline { font-size:12.5px; color:#9fd8b4; margin-top:2px; }
  .badge { margin-left:auto; background:#2fe673; color:#04331a; font-size:11px; font-weight:800; padding:5px 9px; border-radius:999px; flex:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .stat { background:#0d3520; border:1px solid #175732; border-radius:16px; padding:13px 14px; }
  .stat .lbl { font-size:12.5px; color:#9fd8b4; }
  .stat .val { font-size:22px; font-weight:800; margin-top:3px; }
  .stat.hero { grid-column:1 / -1; background:linear-gradient(135deg,#11602f,#0d4525); }
  .stat.hero .val { font-size:30px; color:#7dffab; }
  .card { background:#0d3520; border:1px solid #175732; border-radius:16px; padding:14px; margin-top:12px; }
  .card h3 { font-size:14.5px; margin-bottom:10px; color:#d9ffe6; }
  .payrow { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
  .payrow .amt { margin-left:auto; font-weight:700; }
  .bar { height:7px; background:#0a2a19; border-radius:99px; overflow:hidden; margin:2px 0 6px; }
  .bar i { display:block; height:100%; background:#2fe673; border-radius:99px; }
  .toprow, .entry { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid #12402a; font-size:14px; }
  .toprow:last-child, .entry:last-child { border-bottom:none; }
  .toprow .amt, .entry .amt { margin-left:auto; font-weight:700; white-space:nowrap; }
  .entry .tm { color:#9fd8b4; font-size:12px; white-space:nowrap; }
  .entry .dt { color:#c9f2d8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .diff-ok { color:#7dffab; font-weight:700; }
  .diff-bad { color:#ffb35c; font-weight:700; }
  .btns { display:flex; gap:10px; margin-top:14px; }
  button { flex:1; background:#2fe673; color:#04331a; border:none; border-radius:13px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; }
  button.ghost { background:#0d3520; color:#7dffab; border:1px solid #1d7a46; }
  .msg { text-align:center; color:#9fd8b4; padding:42px 18px; font-size:15px; line-height:1.6; }
  .foot { text-align:center; color:#5f9c76; font-size:11.5px; margin-top:18px; }
  .streak { color:#ffb35c; font-weight:800; }
</style>
</head>
<body>
<div id="app"><div class="msg" id="status">⏳ በመጫን ላይ…<br>Loading your book…</div></div>
<div class="foot">Hisab ሂሳብ · የእርስዎ መዝገብ፣ የእርስዎ ብቻ</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function fmt(n) { return Number(n || 0).toLocaleString('en-US') + ' ብር'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fail(am, en) {
  document.getElementById('app').innerHTML = '<div class="msg">' + am + '<br>' + en + '</div>';
}
var API_URL = 'https://xhstkljqhulkkwfrwqpv.supabase.co/functions/v1/swift-action';
function callApi(action, done) {
  var body = { initData: tg ? tg.initData : '' };
  if (action) body.action = action;
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(done)
    .catch(function () { fail('⚠️ አልተገናኘም።', 'Connection failed — check your internet and try again.'); });
}
function render(d) {
  if (!d || !d.ok) { fail('🔒 ይህ ገጽ ከሂሳብ ቦት ውስጥ ብቻ ይከፈታል።', 'Open this dashboard from inside the Hisab bot.'); return; }
  var t = d.totals, h = '';
  h += '<div class="head"><div class="logo">ሂ</div><div><div class="shopname">' + esc(d.shop.name) + '</div>'
     + '<div class="subline">' + esc(d.date) + (d.streak > 0 ? ' · <span class="streak">🔥 ' + d.streak + '</span>' : '') + '</div></div>'
     + '<div class="badge">MANAGER</div></div>';
  h += '<div class="grid">'
     + '<div class="stat hero"><div class="lbl">💰 ዛሬ የተሸጠ · Sold today</div><div class="val">' + fmt(t.sold) + '</div></div>'
     + '<div class="stat"><div class="lbl">🧾 ወጪ · Spent</div><div class="val">' + fmt(t.spent) + '</div></div>'
     + '<div class="stat"><div class="lbl">✅ ቀሪ · Money left</div><div class="val">' + fmt(t.left) + '</div></div>'
     + '<div class="stat"><div class="lbl">💛 ዕዳ · Owed to you</div><div class="val">' + fmt(t.owed) + '</div></div>'
     + '<div class="stat"><div class="lbl">📝 መዝገቦች · Entries</div><div class="val">' + d.count + '</div></div>'
     + '</div>';
  var maxPay = Math.max(d.byPay.cash, d.byPay.telebirr, d.byPay.cbe, 1);
  function payRow(icon, name, v) {
    return '<div class="payrow"><span>' + icon + ' ' + name + '</span><span class="amt">' + fmt(v) + '</span></div>'
         + '<div class="bar"><i style="width:' + Math.round(v / maxPay * 100) + '%"></i></div>';
  }
  h += '<div class="card"><h3>💳 በክፍያ አይነት · Sales by payment</h3>'
     + payRow('💵', 'ጥሬ ገንዘብ Cash', d.byPay.cash)
     + payRow('📱', 'ቴሌብር Telebirr', d.byPay.telebirr)
     + payRow('🏦', 'CBE', d.byPay.cbe) + '</div>';
  if (d.top && d.top.length) {
    h += '<div class="card"><h3>🏆 ብዙ የተሸጠ · What people buy most</h3>';
    for (var i = 0; i < d.top.length; i++) {
      h += '<div class="toprow"><span>' + esc(d.top[i].name) + ' ×' + d.top[i].count + '</span><span class="amt">' + fmt(d.top[i].total) + '</span></div>';
    }
    h += '</div>';
  }
  if (d.closing) {
    var ok = Number(d.closing.diff) === 0;
    h += '<div class="card"><h3>🌙 የምሽት ቆጠራ · Closing check</h3>'
       + '<div class="toprow"><span>🧮 ቆጥረዋል · Counted</span><span class="amt">' + fmt(d.closing.counted) + '</span></div>'
       + '<div class="toprow"><span>📒 ተመዝግቧል · Recorded</span><span class="amt">' + fmt(d.closing.recorded) + '</span></div>'
       + '<div class="toprow"><span>ልዩነት · Difference</span><span class="amt ' + (ok ? 'diff-ok' : 'diff-bad') + '">' + fmt(d.closing.diff) + (ok ? ' ✓' : '') + '</span></div></div>';
  }
  h += '<div class="card"><h3>📋 የዛሬ መዝገቦች · Today\'s records</h3>';
  if (!d.entries.length) h += '<div class="msg" style="padding:16px">ዛሬ ገና ምንም አልተመዘገበም።<br>Nothing recorded yet today.</div>';
  for (var j = 0; j < d.entries.length; j++) {
    var e = d.entries[j];
    var icon = e.type === 'sale' ? '🟢' : e.type === 'expense' ? '🔴' : '💛';
    var det = e.type === 'sale' ? (e.details + (e.pay ? ' · ' + e.pay : '')) : e.details;
    h += '<div class="entry"><span>' + icon + '</span><span class="dt">' + esc(det) + '</span><span class="amt">' + fmt(e.amount) + '</span><span class="tm">' + esc(e.time) + '</span></div>';
  }
  h += '</div>';
  h += '<div class="btns"><button class="ghost" id="btnRefresh">🔄 Refresh</button><button id="btnExcel">📥 Excel</button></div>';
  document.getElementById('app').innerHTML = h;
  document.getElementById('btnRefresh').onclick = function () { load(); };
  document.getElementById('btnExcel').onclick = function () {
    callApi('excel', function (r) {
      if (r && r.ok) { if (tg) tg.showPopup({ message: '📥 Excel ወደ ቴሌግራም ቻትዎ ተልኳል ✓' }); }
      else fail('⚠️ Excel አልተላከም።', 'The Excel could not be sent.');
    });
  };
}
function load() { callApi(null, render); }
if (tg) { tg.ready(); tg.expand(); }
if (!tg || !tg.initData) { fail('🔒 ይህ ገጽ ከሂሳብ ቦት ውስጥ ብቻ ይከፈታል።', 'Open this dashboard from inside the Hisab bot: Manager panel → 🌐 Dashboard.'); }
else load();
</script>
</body>
</html>
